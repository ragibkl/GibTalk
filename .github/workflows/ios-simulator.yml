# Builds GibTalk for the iOS simulator, runs .maestro/ios-screenshots.yaml on
# an iPhone and an iPad, and uploads the screenshots (App Store sizes, with a
# clean status bar). Run it from the Actions tab or `gh workflow run`.
name: iOS simulator check

on:
  workflow_dispatch:

jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Generate the iOS project
        run: npx expo prebuild --platform ios

      - name: Build for the simulator
        run: |
          set -o pipefail
          xcodebuild -workspace ios/GibTalk.xcworkspace -scheme GibTalk \
            -configuration Release -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO | tail -n 40
          ls build/Build/Products/Release-iphonesimulator/

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Run on iPhone and iPad
        run: |
          set -x
          runtime=$(xcrun simctl list runtimes -j | python3 -c 'import json,sys; r=[x for x in json.load(sys.stdin)["runtimes"] if x["platform"]=="iOS" and x["isAvailable"]]; print(r[-1]["identifier"])')
          app=build/Build/Products/Release-iphonesimulator/GibTalk.app
          mkdir -p screenshots
          for spec in "iphone-6.9:com.apple.CoreSimulator.SimDeviceType.iPhone-16-Pro-Max" "ipad-13:com.apple.CoreSimulator.SimDeviceType.iPad-Pro-13-inch-M4-8GB"; do
            name=${spec%%:*}; type=${spec#*:}
            udid=$(xcrun simctl create "$name" "$type" "$runtime")
            xcrun simctl boot "$udid"
            xcrun simctl bootstatus "$udid" -b
            xcrun simctl status_bar "$udid" override --time "9:41" \
              --dataNetwork wifi --wifiMode active --wifiBars 3 \
              --batteryState charged --batteryLevel 100
            xcrun simctl install "$udid" "$app"
            mkdir -p "screenshots/$name"
            maestro --device "$udid" test -e OUT="$PWD/screenshots/$name" \
              .maestro/ios-screenshots.yaml || echo "maestro failed on $name" >> screenshots/failures.txt
            xcrun simctl io "$udid" screenshot "screenshots/$name/99-last-screen.png" || true
            xcrun simctl shutdown "$udid"
          done
          # GibTalk is landscape, but the simulator saves portrait framebuffers
          # with the app turned sideways: turn those upright.
          find screenshots ~/.maestro/tests -name '*.png' | while read f; do
            w=$(sips -g pixelWidth "$f" | awk '/pixelWidth/{print $2}')
            h=$(sips -g pixelHeight "$f" | awk '/pixelHeight/{print $2}')
            if [ "$h" -gt "$w" ]; then sips -r 270 "$f" >/dev/null; fi
          done
          ls -R screenshots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-screenshots
          path: |
            screenshots
            ~/.maestro/tests
