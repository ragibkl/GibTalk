# Runs on the iOS simulator in CI (.github/workflows/ios-simulator.yml):
# fills the board from templates, opens the main screens and the language
# list, and saves screenshots for the App Store and for checking.
# Icon buttons are named "<icon glyph>, <label>" on iOS, hence ".*, Edit".
appId: com.ragibkl.GibTalk
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: ".*, Edit"
    timeout: 30000

# Edit mode: type the number the app shows.
- tapOn: ".*, Edit"
- copyTextFrom: "Please input \\d{4} to continue"
- evalScript: ${output.code = maestro.copiedText.match(/\d{4}/)[0]}
- tapOn:
    id: "passcode-input"
- inputText: ${output.code}
- tapOn: "Ok"

# Templates screen, then add a few templates.
- tapOn: ".*, Templates"
- extendedWaitUntil:
    visible: "Import from file"
    timeout: 30000
- takeScreenshot: ${OUT}/04-templates
- tapOn: "Greetings"
- tapOn: "Ok"
- extendedWaitUntil:
    visible: "Greetings"
    timeout: 30000
- tapOn: ".*, Templates"
- extendedWaitUntil:
    visible: "Import from file"
    timeout: 30000
- tapOn: "Mealtime"
- tapOn: "Ok"
- extendedWaitUntil:
    visible: "Mealtime"
    timeout: 30000
- tapOn: ".*, Templates"
- extendedWaitUntil:
    visible: "Import from file"
    timeout: 30000
- tapOn: "Outdoor Gym"
- tapOn: "Ok"
- extendedWaitUntil:
    visible: "Outdoor Gym"
    timeout: 30000
- tapOn: ".*, Done"
- takeScreenshot: ${OUT}/01-board

# Inside a folder, building a sentence.
- tapOn: "Greetings"
- extendedWaitUntil:
    visible: "Hi"
    timeout: 30000
- tapOn: "Hi"
- tapOn: "Good Morning"
- takeScreenshot: ${OUT}/02-folder
- tapOn: ".*, Home"

# Keyboard screen.
- tapOn: "Keyboard, tab.*"
- tapOn:
    id: "keyboard-input"
- inputText: "I want to play outside"
- hideKeyboard
- takeScreenshot: ${OUT}/03-keyboard
- tapOn: "Home, tab.*"

# The language list comes from the device's voices (native module).
- tapOn: ".*, Edit"
- copyTextFrom: "Please input \\d{4} to continue"
- evalScript: ${output.code = maestro.copiedText.match(/\d{4}/)[0]}
- tapOn:
    id: "passcode-input"
- inputText: ${output.code}
- tapOn: "Ok"
- tapOn: ".*, Add"
- tapOn: "English"
- takeScreenshot: ${OUT}/05-language-list
